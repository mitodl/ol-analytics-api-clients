name: CI - Axios TypeScript Packages

on:
  push:
    branches: [main]
  # Every PR, not just ones touching the packages: ci-gate below is the check to require,
  # and a path-filtered required check never reports.
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test-axios-package:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - ol-analytics-dashboard-api-axios
          - ol-analytics-learner-records-api-axios

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: src/typescript/${{ matrix.package }}
        run: yarn install --immutable

      - name: Run pack dry-run
        working-directory: src/typescript/${{ matrix.package }}
        run: yarn pack --dry-run

  # The one check to require: the matrix above can change without editing the ruleset.
  ci-gate:
    name: ci-gate
    needs: [test-axios-package]
    # Without this the gate is skipped when a dependency fails, and GitHub treats a
    # skipped required job as successful.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate CI result
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::CI did not succeed: $(echo "$failed" | paste -sd, -)"
            exit 1
          fi
