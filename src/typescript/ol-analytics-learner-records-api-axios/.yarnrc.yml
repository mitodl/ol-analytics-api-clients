nodeLinker: node-modules
enableScripts: false

# Skip npm versions published in the last 7 days (10080 minutes), matching Renovate's
# minimumReleaseAge. A number of minutes, because Yarn 4.10 doesn't read "7d" as 7 days.
# Our own packages (@mitodl/* and eslint-config-mitodl) are exempt so a same-day release can be picked up.
npmMinimalAgeGate: 10080

npmPreapprovedPackages:
  - "@mitodl/*"
  - eslint-config-mitodl
